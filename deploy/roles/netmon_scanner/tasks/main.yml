---
- name: update and upgrade apt packages
  become: true
  block:
    - name: configure apt to allow release info change
      become: true
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/99allow-release-info-change
        state: present
        create: yes
        line: Acquire::AllowReleaseInfoChange::Suite "true";
    - name: run apt
      ansible.builtin.apt:
        upgrade: full
        update_cache: true
        cache_valid_time: 86400

- name: install dependencies
  block:
    - name: install apt dependencies
      ansible.builtin.apt:
        name: [ dnsutils, nmap, openjdk-8-jre ]
        state: present
      become: true

- name: build artifact if necessary
  local_action:
    module: ansible.builtin.shell
    chdir: "{{ project_dir }}"
    cmd: "./gradlew --no-daemon clean shadowJar"
    creates: "{{ netmon_scanner_build_artifact }}"
  run_once: True

- name: copy artifact
  become: true
  ansible.builtin.copy:
    src: "{{ netmon_scanner_build_artifact }}/"
    dest: "{{ package_dir }}/netmon-scanner/"
