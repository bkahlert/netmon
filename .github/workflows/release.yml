name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  js:
    # Karma needs a Chrome; the arm runners have none, ubuntu-latest ships Google Chrome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - run: make test-js

  publish:
    needs: js
    runs-on: ubuntu-24.04-arm
    # The signing key is a secret of this environment, and only v* tags may deploy to it.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: packages/netmon-metrics/src/go.mod, cache-dependency-path: packages/netmon-metrics/src/go.sum }
      - run: uv sync --frozen
      - run: make build
      - run: make browser BROWSER_ARGS=--with-deps
      - run: make test-jvm
      - run: make test-metrics
      - run: make test-tier0
      - run: make test-layout
      - run: make test-tier1
      - name: Check out the published repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
      - name: Add packages and regenerate the signed index
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          printf '%s' "$APT_SIGNING_KEY" > "$RUNNER_TEMP/key.asc"
          uv run --frozen python -m pihero_testkit.repo publish --debs 'dist/*.deb' --repo gh-pages/apt --key "$RUNNER_TEMP/key.asc" --origin netmon --label netmon --description 'Netmon packages'
          rm -f "$RUNNER_TEMP/key.asc"
      - name: Push
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: ${GITHUB_REF_NAME}"
          git push
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.deb --verify-tag --generate-notes "${prerelease[@]}"
