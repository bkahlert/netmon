# Netmon web display at the server root; := overrides the document root lighttpd.conf set before the includes.
server.document-root := "/usr/share/netmon/web"

# The bundle, the images and the JSON carry a hash of their content in their names, so a browser may keep them for good.
# The page that names them and the kiosk's sample must be asked for again every time.
server.modules += ( "mod_setenv" )
$HTTP["url"] =~ "^/(netmon\.[0-9a-f]{8}\.js|(assets|images|fonts)/.+\.[0-9a-f]{8}\.[a-z0-9]+)$" {
  setenv.add-response-header = ( "Cache-Control" => "public, max-age=31536000, immutable" )
}
$HTTP["url"] =~ "^/(index\.html|stats\.json)?$" {
  setenv.add-response-header = ( "Cache-Control" => "no-cache" )
}
