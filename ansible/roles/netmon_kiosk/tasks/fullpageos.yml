---
- name: uninstall x11vnc
  block:
    - name: disable x11vnc.service
      ansible.builtin.systemd:
        name: x11vnc.service
        state: stopped
        enabled: no
      become: true
      failed_when: false
      no_log: true
    - name: remove x11vnc.service unit
      ansible.builtin.file:
        path: /etc/systemd/system/x11vnc.service
        state: absent
      become: true
    - name: remove package
      ansible.builtin.apt:
        name: [ x11vnc ]
        state: absent
        autoremove: true
      become: true
    - name: remove .vnc directory
      ansible.builtin.file:
        path: /home/pi/.vnc
        state: absent
      become: true

- name: undo wpa_supplicant symlink
  vars:
    wpas_conf: /etc/wpa_supplicant/wpa_supplicant.conf
  block:
    - name: check if {{ wpas_conf }} is a symlink
      ansible.builtin.stat: { path: "{{ wpas_conf }}" }
      register: wpa_supplicant_conf

    - name: determine symlink target
      ansible.builtin.command: readlink -f '{{ wpas_conf }}'
      register: wpa_supplicant_conf_symlink_target
      changed_when: false
      when: wpa_supplicant_conf.stat.islnk

    - name: move symlink target back to {{ wpas_conf }}
      become: true
      ansible.builtin.command: mv '{{ wpa_supplicant_conf_symlink_target.stdout }}' '{{ wpas_conf }}'
      when: wpa_supplicant_conf.stat.islnk and wpa_supplicant_conf_symlink_target.stdout != ''

    - name: fix permissions of {{ wpas_conf }}
      become: true
      ansible.builtin.file:
        path: '{{ wpas_conf }}'
        owner: root
        group: root
        mode: '0600'
      when: wpa_supplicant_conf.stat.islnk and wpa_supplicant_conf_symlink_target.stdout != ''

- name: remove service units referencing /home/pi/scripts
  become: true
  ansible.builtin.shell: >
    grep --files-with-matches --recursive '^ExecStart=/home/pi/scripts/' /etc/systemd/system
    | xargs --no-run-if-empty rm -f
  failed_when: false

- name: guard lines that work with the wlan0 interface in /etc/rc.local without checking if it exists
  become: true
  ansible.builtin.replace:
    path: /etc/rc.local
    regexp: '^(?!#)(?!! ip )(?P<line>.*\bwlan0\b.*)$'
    # Matches lines containing 'wlan0' as a word (that is, it matches 'echo wlan0' but not 'echo wlan00'), but
    # not lines that are commented out '#', or
    # already contain a guard.
    replace: '! ip link show wlan0 >/dev/null 2>&1 || \g<line>'
    # The guard uses the "! ... || ..." to also return true if there's no wlan0.
    # Otherwise, if this was the last line, the script would exit with a non-zero exit code,
    # although it finished successfully.
    # (That's a general shell script behavior, not specific to /etc/rc.local.)
    backup: true
  failed_when: false

- name: remove FullPageOS config files
  become: true
  shell: "rm -rf /boot/fullpage*"

- name: copy splash image
  become: true
  ansible.builtin.copy:
    src: files/splash.png
    dest: /boot/splash.png
